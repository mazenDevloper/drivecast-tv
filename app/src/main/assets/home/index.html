<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>DriveCast TV</title>
<style>
/* The TV home: Apple-TV-like shelves in DriveCast's glass. Built for a 1920×1080 screen and a remote's arrows. */
:root{--bg:#0a0e13;--card:#121a22;--ink:#f2efe6;--dim:#a9b3bf;--line:rgba(255,255,255,.08);--accent:#34d399;--gold:#f5c96a}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Noto Sans Arabic","Noto Naskh Arabic","Roboto",sans-serif;overflow:hidden}
.screen{width:1920px;height:1080px;padding:36px 64px 40px;display:flex;flex-direction:column;gap:22px;position:relative}
/* the wallpaper: a light veil over the sky, solid ink under the shelves so text stays readable */
.wall{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-2;transition:background-image .6s}
.veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,14,19,.15) 0%,rgba(10,14,19,.25) 36%,rgba(10,14,19,.86) 64%,#0a0e13 84%)}
.glass{background:rgba(18,26,34,.62)!important;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.line{font-size:20px;color:var(--gold);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px}
.clock b{display:block;font-size:44px;font-variant-numeric:tabular-nums}
.clock span{font-size:20px;color:var(--dim)}
.tabs{display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tab{padding:12px 28px;border-radius:999px;font-size:24px;font-weight:600;color:#d6dbe1;border:0;background:none;font-family:inherit}
.tab.on{background:var(--ink);color:var(--bg);font-weight:700}
.wx{font-size:24px;color:#d6dbe1;min-width:180px;text-align:left}
.f{outline:none;transition:transform .18s ease,box-shadow .18s ease}
.f:focus{transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,.92),0 26px 50px rgba(0,0,0,.55);z-index:2}
.tab.f:focus{transform:none;box-shadow:0 0 0 3px var(--accent)}
.hero{display:flex;flex-direction:column;gap:16px;width:1080px;align-self:flex-start;padding:28px 40px;border-radius:40px;background:var(--card);border:1px solid var(--line)}
.hero .l{flex:1;display:flex;flex-direction:column;gap:8px}
.hero small{font-size:24px;color:var(--accent);font-weight:600}
.hero h1{margin:0;font-size:72px;line-height:1.05}
.hero p{margin:0;font-size:24px;color:var(--dim)}
.times{width:100%;display:flex;flex-direction:column;justify-content:center;gap:14px}
.times .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center}
.times .p{padding:10px 0;border-radius:22px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:4px}
.times .p span{font-size:21px;color:var(--dim)} .times .p b{font-size:30px;font-variant-numeric:tabular-nums}
.times .p.past b{color:#7c8794} .times .p.next{background:var(--accent);color:#062016} .times .p.next span{color:#062016}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
h2{margin:0 0 4px;font-size:28px}
.shelf{display:flex;gap:28px;padding:14px 18px 18px;margin:0 -18px;overflow:hidden}
.card{flex:none;width:340px;height:190px;border-radius:26px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border:0;color:var(--ink);text-align:right;font-family:inherit}
.card b{font-size:34px} .card span{font-size:19px;opacity:.8}
.app{flex:none;width:236px;height:140px;border-radius:26px;background:rgba(20,28,37,.8);border:1px solid var(--line);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:inherit;color:var(--ink)}
.app img{width:100%;height:100%;object-fit:cover}.app img.icon{width:72px;height:72px;object-fit:contain}
.app.icon{flex-direction:column;gap:8px;font-size:19px}
.match{flex:none;width:420px;height:150px;border-radius:26px;background:#141c25;border:1px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-family:inherit;text-align:right}
.match .t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:24px;font-weight:700}
.match .t img{width:40px;height:40px;object-fit:contain}
.match .t .s{font-variant-numeric:tabular-nums;font-size:32px}
.match small{font-size:18px;color:var(--dim)} .match.live small{color:var(--accent)}
.page{display:none;flex-direction:column;gap:14px;min-height:0}.page.on{display:flex}
.sal{position:absolute;bottom:22px;left:64px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.06);font-size:20px;color:#cfd6de}
.empty{font-size:22px;color:var(--dim);padding:20px 4px}
.panel{position:absolute;inset:0;background:rgba(5,8,11,.72);display:none;align-items:center;justify-content:center}
.panel.on{display:flex}
.panel .box{width:1100px;max-height:1000px;overflow:auto;padding:48px 56px;border-radius:44px;background:#15221c;border:1px solid rgba(52,211,153,.3);display:flex;flex-direction:column;gap:22px}
.panel h3{margin:0;font-size:46px}
.cities{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.btn{height:72px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--ink);font-weight:600;font-size:24px;font-family:inherit}
.btn.on{background:var(--ink);color:var(--bg)}
.note{font-size:22px;color:#cfe1d8;line-height:1.7}

.scroll{overflow:auto;height:930px;padding:0 4px 120px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:10px 4px 18px}
.grid.ch{grid-template-columns:repeat(6,1fr)}
.sura{height:84px;border-radius:20px;border:1px solid var(--line);background:rgba(20,28,37,.8);color:var(--ink);font-family:inherit;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.sura small{font-size:16px;color:var(--dim);font-variant-numeric:tabular-nums}
.sura.on{background:var(--accent);color:#062016}.sura.on small{color:#062016}
.chip{flex:none;height:64px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:rgba(20,28,37,.8);color:var(--ink);font-family:inherit;font-size:22px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.vid{flex:none;width:340px;border-radius:22px;background:rgba(20,28,37,.8);border:1px solid var(--line);padding:0;overflow:hidden;color:var(--ink);font-family:inherit;text-align:right}
.vid img{width:100%;height:190px;object-fit:cover;display:block}.vid span{display:block;padding:10px 14px;font-size:18px;line-height:1.35;height:52px;overflow:hidden}
.chan{flex:none;width:200px;height:200px;border-radius:26px;background:rgba(20,28,37,.8);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);font-family:inherit;font-size:18px;padding:12px;text-align:center}
.chan img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#222}
.ichan{height:110px;border-radius:20px;background:rgba(20,28,37,.8);border:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;color:var(--ink);font-family:inherit;font-size:20px;text-align:right;overflow:hidden}
.ichan img{width:64px;height:64px;object-fit:contain;flex:none}
.player{position:absolute;bottom:22px;left:420px;right:64px;height:96px;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 18px 0 34px;z-index:5}
.player>div{flex:1;display:flex;flex-direction:column}.player b{font-size:26px}.player span{font-size:18px;color:var(--dim)}
.player .btn{height:64px;padding:0 26px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wall" id="wall"></div><div class="veil" id="veil"></div>
<div class="screen">
  <div class="top">
    <div class="clock"><b id="time">--:--</b><span id="date"></span><div class="line" id="line"></div></div>
    <nav class="tabs" id="tabs">
      <button class="tab f on" data-page="home">الرئيسية</button>
      <button class="tab f" data-page="quran">القرآن</button>
      <button class="tab f" data-page="subs">الاشتراكات</button>
      <button class="tab f" data-page="iptv">القنوات</button>
      <button class="tab f" data-page="matches">المباريات</button>
      <button class="tab f" data-page="apps">التطبيقات</button>
      <button class="tab f" data-act="settings">الإعدادات</button>
    </nav>
    <div class="wx" id="wx"></div>
  </div>

  <section class="page on" id="p-home">
    <div class="hero glass">
      <div class="l"><small>الصلاة القادمة</small><h1 id="next">…</h1><p id="nextSub"></p></div>
      <div class="times"><div class="row" id="times"></div><div class="bar"><i id="prog" style="width:0"></i></div></div>
    </div>
    <div><h2>القرآن والأذكار</h2><div class="shelf" id="s-quran"></div></div>
    <div><h2>التطبيقات</h2><div class="shelf" id="s-apps"></div></div>
  </section>

  <section class="page" id="p-quran"><div class="scroll">
    <h2>القارئ</h2><div class="shelf" id="s-reciters"></div>
    <h2>السور</h2><div class="grid" id="s-surahs"></div>
    <h2>الأذكار والرقية</h2><div class="shelf" id="s-quran2" style="flex-wrap:wrap"></div>
  </div></section>
  <section class="page" id="p-subs"><div class="scroll">
    <h2>تابع المشاهدة</h2><div class="shelf" id="s-continue"></div>
    <h2>قنواتك</h2><div class="shelf" id="s-channels" style="flex-wrap:wrap"></div>
    <h2>القرّاء في DriveCast</h2><div class="shelf" id="s-ytreciters" style="flex-wrap:wrap"></div>
    <h2>المحفوظة</h2><div class="shelf" id="s-saved" style="flex-wrap:wrap"></div>
  </div></section>
  <section class="page" id="p-iptv"><div class="scroll">
    <h2>مفضّلتك في DriveCast</h2><div class="shelf" id="s-ifav" style="flex-wrap:wrap"></div>
    <h2>القنوات العربية</h2><div class="shelf" id="s-igroups"></div><div class="grid ch" id="s-ilist"></div>
  </div></section>
  <section class="page" id="p-matches"><h2>مباريات اليوم</h2><div class="shelf" id="s-matches" style="flex-wrap:wrap"></div></section>
  <section class="page" id="p-apps"><h2>كل التطبيقات</h2><div class="shelf" id="s-apps2" style="flex-wrap:wrap"></div></section>

  <div class="player glass" id="player" hidden><div><b id="plTitle"></b><span id="plSub"></span></div><button class="btn f" data-act="pl-prev">السابقة</button><button class="btn f" data-act="pl-toggle" id="plToggle">إيقاف</button><button class="btn f" data-act="pl-next">التالية</button></div>
  <div class="sal">اللهم صلِّ وسلّم على نبينا محمد ﷺ</div>

  <div class="panel" id="panel"><div class="box">
    <h3>الإعدادات</h3>
    <div class="note">مدينة مواقيت الصلاة:</div>
    <div class="cities" id="cities"></div>
    <div class="note">الخلفية:</div>
    <div class="cities" id="walls"></div>
    <div class="note" id="phone"></div>
    <div class="note" id="overlay"></div>
    <div style="display:flex;gap:14px"><button class="btn f" data-act="system">إعدادات التلفزيون</button><button class="btn f" data-act="close">إغلاق</button></div>
  </div></div>
</div>

<script>
const FAKE = {   // in a browser (preview) the page still shows, with sample data
  apps: () => '[]', open: () => false, youtube: id => open('https://youtu.be/' + id), link: u => open(u),
  prayers: () => JSON.stringify({ today: ['05:02', '12:08', '15:22', '17:42', '18:58'], tomorrow: null, city: 'مسقط', lat: 23.588, lon: 58.383, method: 8 }),
  setCity: () => {}, phoneUrl: () => 'http://192.168.1.20:8080', canOverlay: () => true, settings: () => {},
};
const TV = window.TV || FAKE;
const $ = s => document.querySelector(s), AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const NAMES = ['الفجر', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
// noor-tv's videos (MIT, majedphotos): Surat Al-Kahf, Al-Baqara, morning and evening adhkar, ruqya
const CARDS = [
  { t: 'سورة الكهف', s: 'يوم الجمعة', v: '9k1U0aGQRNA', c: '#1f5e4a' },
  { t: 'سورة البقرة', s: 'تُقرأ في البيت', v: '9HW7j9lZZTU', c: '#2b3a55' },
  { t: 'أذكار الصباح', s: 'بعد الفجر', v: 'fD4uDIoCn3M', c: '#6b4a1f' },
  { t: 'أذكار المساء', s: 'بعد العصر', v: 'rQnNno3Do60', c: '#3a2c55' },
  { t: 'الرقية الشرعية', s: 'للبيت وأهله', v: 'BVtCjMyJ320', c: '#1f4a5e' },
];
const CITIES = [
  ['مسقط', 23.588, 58.383, 8], ['صلالة', 17.019, 54.089, 8], ['صحار', 24.347, 56.709, 8], ['نزوى', 22.933, 57.533, 8],
  ['دبي', 25.204, 55.270, 16], ['أبوظبي', 24.453, 54.377, 16], ['الرياض', 24.713, 46.675, 4], ['مكة', 21.389, 39.858, 4],
  ['الكويت', 29.376, 47.977, 9], ['الدوحة', 25.285, 51.531, 10], ['المنامة', 26.228, 50.586, 8], ['القاهرة', 30.044, 31.236, 5],
];

// ---- clock, hijri date, weather
function tick() {
  const d = new Date();
  $('#time').textContent = d.toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });
  let hijri = ''; try { hijri = d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
  $('#date').textContent = d.toLocaleDateString('ar', { weekday: 'long' }) + ' · ' + hijri + ' · ' + d.toLocaleDateString('ar', { day: 'numeric', month: 'long' });
  prayersUi(); dayLine(); applyWall();
}
let P = {};
function loadPrayers() { try { P = JSON.parse(TV.prayers()) || {}; } catch (e) { P = {}; } prayersUi(); weather(); }
function at(hm, plusDay) { const [h, m] = hm.split(':').map(Number), d = new Date(); d.setHours(h, m, 0, 0); if (plusDay) d.setDate(d.getDate() + 1); return d; }
function prayersUi() {
  const t = P.today; if (!t) { $('#next').textContent = 'المواقيت عند أول اتصال'; return; }
  const now = new Date(), list = t.map((x, i) => ({ i, d: at(x) }));
  let n = list.find(x => x.d > now), prev = [...list].reverse().find(x => x.d <= now);
  if (!n) n = { i: 0, d: at((P.tomorrow || t)[0], true) };
  const mins = Math.round((n.d - now) / 60000);
  $('#next').textContent = NAMES[n.i] + ' ' + (mins < 60 ? 'بعد ' + AR(mins) + ' دقيقة' : 'بعد ' + AR(Math.floor(mins / 60)) + ' س ' + AR(mins % 60) + ' د');
  $('#nextSub').textContent = (P.city ? P.city + ' · ' : '') + 'الأذان يتنبّه إذا كان فيلم يعمل، ولا يقطعه';
  $('#times').innerHTML = t.map((x, i) => `<div class="p ${i === n.i ? 'next' : list[i].d <= now ? 'past' : ''}"><span>${NAMES[i]}</span><b>${AR(fmt(x))}</b></div>`).join('');
  const from = prev ? prev.d : at(t[0]), span = n.d - from;
  $('#prog').style.width = Math.max(0, Math.min(100, (now - from) / span * 100)) + '%';
}
const fmt = hm => { let [h, m] = hm.split(':').map(Number); h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0'); };
let wxAt = 0;
function weather() {
  if (!P.lat || Date.now() - wxAt < 30 * 60000) return; wxAt = Date.now();
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${P.lat}&longitude=${P.lon}&current=temperature_2m`).then(r => r.json())
    .then(j => { const c = j.current?.temperature_2m; if (c != null) $('#wx').textContent = (P.city || '') + ' ' + AR(Math.round(c)) + '°'; }).catch(() => {});
}


// ---- wallpapers: Omar Al-Rawas mosque (Salalah), and noor-tv's three (MIT, majedphotos); «أوقات اليوم» follows the time of day
const WALLS = [['rawas', 'جامع عمر الرواس'], ['awqat', 'أوقات اليوم'], ['zakhrafa', 'الزخرفة'], ['masjid-layl', 'مسجد الليل'], ['none', 'بلا خلفية']];
function getWall() { try { return localStorage.wall || 'rawas'; } catch (e) { return 'rawas'; } }
function applyWall() {
  const w = getWall(), h = new Date().getHours();
  const f = w === 'none' ? '' : w === 'awqat' ? (h >= 5 && h < 15 ? 'awqat-morning' : h >= 15 && h < 19 ? 'awqat-evening' : 'awqat-night') : w;
  $('#wall').style.backgroundImage = f ? `url(wall/${f}.jpg)` : 'none';
  $('#veil').style.display = f ? '' : 'none';
}
// the line over the clock (noor-tv): Friday, the white days (13-15 of the hijri month), in gold
function dayLine() {
  const d = new Date(); let hd = 0;
  try { hd = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric' }).format(d).replace(/\D/g, ''); } catch (e) {}
  const parts = [];
  if (d.getDay() === 5) parts.push('جمعة مباركة 🌿');
  if (hd >= 13 && hd <= 15) parts.push('الأيام البيض 🤍');
  $('#line').textContent = parts.join(' · ');
}


// ---- the Quran: a reciter, a surah, and it plays here (Quran.com / islamic.network audio, the same reciters as Madar)
const SURAHS = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];
const RECITERS = [["q7","مشاري العفاسي","q","7"],["q6","محمود خليل الحصري","q","6"],["q9","محمد صديق المنشاوي","q","9"],["q2","عبد الباسط (مرتّل)","q","2"],["q1","عبد الباسط (مجوّد)","q","1"],["q3","عبد الرحمن السديس","q","3"],["q10","سعود الشريم","q","10"],["q97","ياسر الدوسري","q","97"],["q4","أبو بكر الشاطري","q","4"],["q5","هاني الرفاعي","q","5"],["q161","خليفة الطنيجي","q","161"],["q12","الحصري (المعلّم)","q","12"],["ar.mahermuaiqly","ماهر المعيقلي","a","ar.mahermuaiqly"],["ar.hudhaify","علي الحذيفي","a","ar.hudhaify"],["ar.muhammadayyoub","محمد أيوب","a","ar.muhammadayyoub"],["ar.muhammadjibreel","محمد جبريل","a","ar.muhammadjibreel"],["ar.ahmedajamy","أحمد العجمي","a","ar.ahmedajamy"],["ar.abdullahbasfar","عبد الله بصفر","a","ar.abdullahbasfar"],["ar.ibrahimakhbar","إبراهيم الأخضر","a","ar.ibrahimakhbar"],["ar.aymanswoaid","أيمن سويد","a","ar.aymanswoaid"],["ar.husarymujawwad","الحصري (مجوّد)","a","ar.husarymujawwad"],["ar.minshawimujawwad","المنشاوي (مجوّد)","a","ar.minshawimujawwad"]];
function getRec() { try { return localStorage.rec || RECITERS[0][0]; } catch (e) { return RECITERS[0][0]; } }
const audio = new Audio(); let playing = null;
async function surahUrl(r, n) {
  if (r[2] === 'a') return `https://cdn.islamic.network/quran/audio-surah/128/${r[3]}/${n}.mp3`;
  const d = await (await fetch(`https://api.qurancdn.com/api/qdc/audio/reciters/${r[3]}/audio_files?chapter=${n}`)).json();
  return d.audio_files?.[0]?.audio_url;
}
async function playSurah(n) {
  const r = RECITERS.find(x => x[0] === getRec()) || RECITERS[0];
  try { audio.src = await surahUrl(r, n); await audio.play(); } catch (e) { $('#plSub').textContent = 'تعذّر التشغيل — تحقق من الإنترنت'; }
  playing = n; $('#player').hidden = false;
  $('#plTitle').textContent = 'سورة ' + SURAHS[n - 1]; $('#plSub').textContent = r[1]; $('#plToggle').textContent = 'إيقاف';
  quranUi();
}
audio.onended = () => { if (playing && playing < 114) playSurah(playing + 1); };
function quranUi() {
  const cur = getRec();
  $('#s-reciters').innerHTML = RECITERS.map(r => `<button class="chip f ${r[0] === cur ? 'on' : ''}" data-rec="${r[0]}">${r[1]}</button>`).join('');
  $('#s-surahs').innerHTML = SURAHS.map((n, i) => `<button class="sura f ${playing === i + 1 ? 'on' : ''}" data-sura="${i + 1}"><small>${AR(i + 1)}</small>${n}</button>`).join('');
}

// ---- subscriptions: the channels, reciters, saved and «continue» of DriveCast and Madar (their shared library)
const BIN = id => `https://studio.c-p.workers.dev/bin/${id}`;
const BINS = { channels: '68ef1b3dd0ea881f40a38bd1', reciters: '6909c1cd43b1c97be997b522', master: '69c782cbb7ec241ddcb0b99a', iptv: '69a87b8bd0ea881f40eeec0c' };
let cbN = 0;
function getText(url) {   // through the app (no CORS limits); in a browser preview, plain fetch
  if (!window.TV || !TV.fetch || TV === FAKE) return fetch(url).then(r => r.text()).catch(() => null);
  return new Promise(res => { const n = '__cb' + (++cbN); window[n] = t => { delete window[n]; res(t); }; TV.fetch(url, n); });
}
async function getJ(url) { const t = await getText(url); try { return t ? JSON.parse(t) : null; } catch (e) { return null; } }
const arr = (...xs) => xs.find(Array.isArray) || [];
const esc = x => String(x || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vidHtml = v => `<button class="vid f" data-yt="${esc(v.id)}"><img src="${esc(v.thumbnail || 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg')}" alt="" loading="lazy"><span>${esc(v.title)}</span></button>`;
const chanHtml = c => `<button class="chan f" data-ch="${esc(c.channelid)}"><img src="${esc(c.image)}" alt="" loading="lazy"><span>${esc(c.name || c.channeltitle)}</span></button>`;
let subsAt = 0;
async function loadSubs() {
  if (Date.now() - subsAt < 5 * 60000) return; subsAt = Date.now();
  const [ch, rc, ms] = await Promise.all([getJ(BIN(BINS.channels)), getJ(BIN(BINS.reciters)), getJ(BIN(BINS.master))]);
  const chans = arr(ch?.channels, ch).sort((a, b) => (b.starred - a.starred) || ((b.clickschannel || 0) - (a.clickschannel || 0)));
  $('#s-channels').innerHTML = chans.map(chanHtml).join('') || '<div class="empty">لا قنوات</div>';
  $('#s-ytreciters').innerHTML = arr(rc?.reciters).sort((a, b) => (b.clickschannel || 0) - (a.clickschannel || 0)).map(chanHtml).join('') || '<div class="empty">لا قرّاء</div>';
  $('#s-continue').innerHTML = arr(ms?.continueWatching).map(c => c.video).filter(v => v && v.id).slice(0, 20).map(vidHtml).join('') || '<div class="empty">لا شيء بعد</div>';
  $('#s-saved').innerHTML = arr(ms?.savedVideos).filter(v => v && v.id).slice(0, 60).map(vidHtml).join('') || '<div class="empty">لا شيء محفوظ</div>';
}

// ---- IPTV: DriveCast's favourite channels + iptv-org's Arabic list, played full screen (up / down = next channel)
let ILIST = [], IGROUP = 'all', IFAV = [];
function parseM3u(t) {
  const out = []; let meta = null;
  for (const raw of String(t || '').split(/\r?\n/)) {
    const l = raw.trim(); if (!l) continue;
    if (l.startsWith('#EXTINF')) { const a = k => (l.match(new RegExp(k + '="([^"]*)"')) || [])[1] || ''; meta = { name: l.slice(l.lastIndexOf(',') + 1).trim(), logo: a('tvg-logo'), group: a('group-title') || 'أخرى' }; }
    else if (!l.startsWith('#') && meta) { out.push({ ...meta, url: l }); meta = null; }
  }
  return out;
}
const ichHtml = (c, i, list) => `<button class="ichan f" data-ilist="${list}" data-i="${i}">${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy">` : ''}<span>${esc(c.name)}</span></button>`;
function iptvUi() {
  const groups = ['all', ...new Set(ILIST.map(c => c.group))].slice(0, 30);
  $('#s-igroups').innerHTML = groups.map(g => `<button class="chip f ${g === IGROUP ? 'on' : ''}" data-igroup="${esc(g)}">${g === 'all' ? 'الكل' : esc(g)}</button>`).join('');
  const shown = ILIST.filter(c => IGROUP === 'all' || c.group === IGROUP).slice(0, 300);
  window.__shown = shown;
  $('#s-ilist').innerHTML = shown.map((c, i) => ichHtml(c, i, 'shown')).join('') || '<div class="empty">جارٍ التحميل…</div>';
}
let iptvAt = 0;
async function loadIptv() {
  if (Date.now() - iptvAt < 30 * 60000) return; iptvAt = Date.now();
  const fav = await getJ(BIN(BINS.iptv));
  IFAV = arr(fav?.iptv, fav?.channels, fav).filter(c => c && c.url).map(c => ({ name: c.name, logo: c.stream_icon, url: c.url, group: c.group || '' }));
  $('#s-ifav').innerHTML = IFAV.map((c, i) => ichHtml(c, i, 'fav')).join('') || '<div class="empty">لا مفضّلة — أضفها من DriveCast</div>';
  iptvUi();
  ILIST = parseM3u(await getText('https://iptv-org.github.io/iptv/languages/ara.m3u'));
  iptvUi();
}

// ---- shelves
function cardsHtml() {
  const u = TV.phoneUrl();
  return CARDS.map((c, i) => `<button class="card f" style="background:${c.c}" data-yt="${c.v}"><span>${c.s}</span><b>${c.t}</b></button>`).join('')
    + `<button class="card f glass" data-act="phone"><span>${u ? u.replace('http://', '') : 'على نفس الواي فاي'}</span><b>💌 اكتب أو ارسم من جوالك</b></button>`;
}
let APPS = [];
function appsHtml(n) {
  return APPS.slice(0, n).map(a => a.tv ? `<button class="app f" data-pkg="${a.pkg}" aria-label="${a.label}"><img src="${a.art}" alt=""></button>`
    : `<button class="app icon f" data-pkg="${a.pkg}"><img class="icon" src="${a.art}" alt=""><span>${a.label}</span></button>`).join('');
}
function loadApps() {
  try { APPS = JSON.parse(TV.apps()); } catch (e) { APPS = []; }
  // the most used first: a simple count kept on the TV
  let use = {}; try { use = JSON.parse(localStorage.use || '{}'); } catch (e) {}
  APPS.sort((a, b) => (use[b.pkg] || 0) - (use[a.pkg] || 0) || (b.tv - a.tv) || a.label.localeCompare(b.label, 'ar'));
  $('#s-apps').innerHTML = appsHtml(6) || '<div class="empty">لا تطبيقات</div>';
  $('#s-apps2').innerHTML = appsHtml(200);
}
async function loadMatches() {
  try {
    const d = await (await fetch('https://studio.c-p.workers.dev/now?lang=27')).json();
    const ms = (d.matches || []).sort((a, b) => (b.favorite - a.favorite) || ((b.status === 'live') - (a.status === 'live')) || (a.timestamp - b.timestamp)).slice(0, 24);
    $('#s-matches').innerHTML = ms.map(m => {
      const live = m.status === 'live', fin = m.status === 'finished', sc = m.score || {};
      const mid = live || fin ? `<span class="s">${AR(sc.home ?? 0)} - ${AR(sc.away ?? 0)}</span>` : `<span class="s" style="font-size:24px">${m.omanTime || ''}</span>`;
      return `<button class="match f ${live ? 'live' : ''}"><div class="t"><span>${m.home?.name || ''}</span>${mid}<span>${m.away?.name || ''}</span></div><small>${live ? '● مباشر ' + (m.elapsed != null ? AR(m.elapsed) + '′' : '') : fin ? 'انتهت' : 'لم تبدأ'} · ${m.league?.name || ''}</small></button>`;
    }).join('') || '<div class="empty">لا مباريات اليوم</div>';
  } catch (e) { $('#s-matches').innerHTML = '<div class="empty">لا اتصال بالإنترنت</div>'; }
}

// ---- pages and settings
function show(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + page));
  document.querySelectorAll('.tab[data-page]').forEach(t => t.classList.toggle('on', t.dataset.page === page));
  if (page === 'matches') loadMatches();
  if (page === 'quran') quranUi();
  if (page === 'subs') loadSubs();
  if (page === 'iptv') loadIptv();
}
function settings(on) {
  $('#panel').classList.toggle('on', on);
  if (!on) return $('.tab.on')?.focus();
  $('#walls').innerHTML = WALLS.map(w => `<button class="btn f ${getWall() === w[0] ? 'on' : ''}" data-wall="${w[0]}">${w[1]}</button>`).join('');
  $('#cities').innerHTML = CITIES.map(c => `<button class="btn f ${P.city === c[0] ? 'on' : ''}" data-city="${c[0]}">${c[0]}</button>`).join('');
  const u = TV.phoneUrl();
  $('#phone').textContent = u ? 'صفحة الجوال (اكتب أو ارسم على التلفزيون): ' + u : 'صفحة الجوال تعمل عندما يتصل التلفزيون بالواي فاي';
  $('#overlay').textContent = TV.canOverlay() ? '' : 'الأذان فوق الأفلام يحتاج إذن «العرض فوق التطبيقات» (يفعّله الإعداد مع كلود)';
  $('#cities .f')?.focus();
}
window.onTvMenu = () => settings(!$('#panel').classList.contains('on'));
window.onTvBack = () => { if ($('#panel').classList.contains('on')) settings(false); else show('home'); };
window.onTvResume = () => { loadApps(); loadPrayers(); };

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.page) return show(b.dataset.page);
  if (b.dataset.act === 'settings') return settings(true);
  if (b.dataset.act === 'close') return settings(false);
  if (b.dataset.act === 'system') return TV.settings();
  if (b.dataset.act === 'phone') return settings(true);
  if (b.dataset.wall) { try { localStorage.wall = b.dataset.wall; } catch (x) {} applyWall(); return settings(true); }
  if (b.dataset.yt) return TV.youtube(b.dataset.yt);
  if (b.dataset.ch) return TV.channel ? TV.channel(b.dataset.ch) : TV.link('https://www.youtube.com/channel/' + b.dataset.ch);
  if (b.dataset.rec) { try { localStorage.rec = b.dataset.rec; } catch (x) {} if (playing) playSurah(playing); return quranUi(); }
  if (b.dataset.sura) return playSurah(+b.dataset.sura);
  if (b.dataset.act === 'pl-toggle') { if (audio.paused) { audio.play(); b.textContent = 'إيقاف'; } else { audio.pause(); b.textContent = 'تشغيل'; } return; }
  if (b.dataset.act === 'pl-next' && playing) return playSurah(Math.min(114, playing + 1));
  if (b.dataset.act === 'pl-prev' && playing) return playSurah(Math.max(1, playing - 1));
  if (b.dataset.igroup) { IGROUP = b.dataset.igroup; return iptvUi(); }
  if (b.dataset.ilist) { const list = b.dataset.ilist === 'fav' ? IFAV : window.__shown; if (TV.watch) TV.watch(JSON.stringify(list.map(c => c.url)), JSON.stringify(list.map(c => c.name)), +b.dataset.i); else TV.link(list[+b.dataset.i].url); return; }
  if (b.dataset.pkg) { let use = {}; try { use = JSON.parse(localStorage.use || '{}'); } catch (x) {} use[b.dataset.pkg] = (use[b.dataset.pkg] || 0) + 1; try { localStorage.use = JSON.stringify(use); } catch (x) {} return TV.open(b.dataset.pkg); }
  if (b.dataset.city) { const c = CITIES.find(x => x[0] === b.dataset.city); TV.setCity(String(c[1]), String(c[2]), c[3], c[0]); setTimeout(() => { loadPrayers(); settings(true); }, 1500); }
});

// ---- the remote: arrows move to the nearest visible button in that direction
function visible(el) { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }
function move(dir) {
  const scope = $('#panel').classList.contains('on') ? $('#panel') : document;
  const all = [...scope.querySelectorAll('.f')].filter(visible), cur = document.activeElement;
  if (!all.includes(cur)) return all[0]?.focus();
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bd = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - ax, dy = y - ay;
    const ok = dir === 'left' ? dx < -5 : dir === 'right' ? dx > 5 : dir === 'up' ? dy < -5 : dy > 5;
    if (!ok) continue;
    const main = dir === 'left' || dir === 'right' ? Math.abs(dx) : Math.abs(dy), side = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    const d = main + side * 2.5;
    if (d < bd) { bd = d; best = el; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}
document.addEventListener('keydown', e => {
  const k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (k) { e.preventDefault(); move(k); }
  if (e.key === 'Escape' || e.key === 'GoBack') { e.preventDefault(); window.onTvBack(); }
});

$('#s-quran').innerHTML = cardsHtml(); $('#s-quran2').innerHTML = cardsHtml();
loadPrayers(); loadApps(); tick(); loadMatches();
setInterval(tick, 20000); setInterval(loadMatches, 120000); setInterval(loadPrayers, 30 * 60000);
document.querySelector('.tab').focus();
// a TV that reports a smaller CSS width (720p / 1080p at a density): the 1920×1080 design scaled to fit
function fit() { document.body.style.zoom = String(Math.min(innerWidth / 1920, innerHeight / 1080)); }
fit(); addEventListener('resize', fit);
</script>
