plugins { id 'com.android.application' }

android {
    namespace 'app.drivecast.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.drivecast.tv'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        // the default city until setup sets the real one (CityReceiver); method: Aladhan numbering (8 = Gulf)
        buildConfigField 'String', 'LAT', '"17.0190"'
        buildConfigField 'String', 'LON', '"54.0890"'
        buildConfigField 'int', 'METHOD', '8'
        buildConfigField 'String', 'CITY', '"صلالة"'
    }

    buildFeatures { buildConfig true }

    // one key for every build, so a new build installs over the old one (the TV's «⬆️ تحديث»): GitHub's build gets it from the
    // repository's secrets (DCTV_KEYSTORE_B64 + DCTV_KEY_PASS, written to a file by apk.yml); a build on a laptop without it
    // falls back to that laptop's debug key
    def ks = System.getenv('DCTV_KEYSTORE')
    signingConfigs {
        dctv {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DCTV_KEY_PASS')
                keyAlias 'drivecast'
                keyPassword System.getenv('DCTV_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.dctv : signingConfigs.debug
        }
    }

    // release builds skip lint's opt-in checks (Media3's player info uses its «unstable» API on purpose)
    lint { checkReleaseBuilds false; abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // the web version's link to DriveCast's hub (a WebSocket that stays open)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // the channel player (like a satellite receiver: the stream's resolution, codec, bit depth, frame rate, bitrate)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
