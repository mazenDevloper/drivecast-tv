plugins { id 'com.android.application' }

android {
    namespace 'app.drivecast.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.drivecast.tv'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        // the default city until setup sets the real one (CityReceiver); method: Aladhan numbering (8 = Gulf)
        buildConfigField 'String', 'LAT', '"17.0190"'
        buildConfigField 'String', 'LON', '"54.0890"'
        buildConfigField 'int', 'METHOD', '8'
        buildConfigField 'String', 'CITY', '"صلالة"'
    }

    buildFeatures { buildConfig true }

    // two editions: «full» (app.drivecast.tv) and «lite» (app.drivecast.tv.lite — its own app beside the full one: the Arabic
    // and Arabic sports channels only, 📻 the radio instead of the Quran tab, وضع المسلسلات first, no matches tab there)
    flavorDimensions 'edition'
    productFlavors {
        full { dimension 'edition'; buildConfigField 'boolean', 'LITE', 'false' }
        lite { dimension 'edition'; applicationIdSuffix '.lite'; versionNameSuffix '-lite'; buildConfigField 'boolean', 'LITE', 'true' }
    }

    // one key for every build, so a new build installs over the old one (the TV's «⬆️ تحديث»). The key is in the repository
    // (app/signing/drivecast-tv.jks) on purpose: GitHub's build and a laptop's sign alike, with no secrets to set up. The TV
    // takes updates only from this repository's own release, so the key being public does not let anyone else push one to it.
    signingConfigs {
        dctv {
            storeFile file('signing/drivecast-tv.jks')
            storePassword '09912750a84d4ba7df31ee5ef098ce7ac2619e96f1b234a1'
            keyAlias 'drivecast'
            keyPassword '09912750a84d4ba7df31ee5ef098ce7ac2619e96f1b234a1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dctv
        }
        // 🪶 Lite, zero-bloat: the same app shrunk by R8 (unused library code and resources out, names shortened); the full
        // edition stays on «release». Lite is built as liteLean (see androidComponents below and .github/workflows/apk.yml)
        lean {
            initWith release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-lite.pro'
            matchingFallbacks = ['release']
        }
    }

    // release builds skip lint's opt-in checks (Media3's player info uses its «unstable» API on purpose)
    lint { checkReleaseBuilds false; abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// one build per edition: full → release, lite → lean
androidComponents {
    beforeVariants(selector().all()) { v ->
        def lite = v.productFlavors.any { it.second == 'lite' }
        if ((lite && v.buildType == 'release') || (!lite && v.buildType == 'lean')) v.enable = false
    }
}

dependencies {
    // the web version's link to DriveCast's hub (a WebSocket that stays open)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // the channel player (like a satellite receiver: the stream's resolution, codec, bit depth, frame rate, bitrate)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    fullImplementation 'androidx.media3:media3-exoplayer-dash:1.4.1'   // 🪶 not in Lite (no DASH channels in its Arabic lists)
    implementation 'androidx.media3:media3-ui:1.4.1'
    fullImplementation 'androidx.media3:media3-effect:1.4.1'   // 🔷 the picture enhancement (Up4K): full only, Lite has a stub
    // ⚡ the start: the app's code compiled ahead on install (baseline-prof.txt) instead of warming up on each boot
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
