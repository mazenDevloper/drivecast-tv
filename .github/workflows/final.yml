name: Final
on:
  push: { paths: ['app/src/main/assets/home/**', 'tools/final.js'] }
  workflow_dispatch:
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: The finished-product check
        run: node tools/final.js
