name: TV test
# DriveCast TV on an Android TV emulator (1080p): install, home screen, remote walk, phone page, crash / memory check.
# Screenshots + report.md come back as the «tv-test» artifact.
on:
  workflow_run: { workflows: [APK], types: [completed] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: The latest APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download latest -p DriveCastTV.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/tv-test.sh DriveCastTV.apk emulator-5554 || touch tv-test/FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tv-test, path: tv-test/ }
      # the screenshots also on the «tv-test» branch, so they can be read without the artifact store
      - name: Results branch
        if: always()
        run: |
          cd tv-test && git init -q -b tv-test && git add -A
          git -c user.name=tv-test -c user.email=tv-test@users.noreply.github.com commit -qm "TV test ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tv-test
      - name: Verdict
        run: test ! -f tv-test/FAILED
