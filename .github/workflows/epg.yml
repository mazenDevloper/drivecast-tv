name: Guide
# the programme guide (EPG), made small for the TV every 4 hours → branch «epg», file epg.json
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/epg.py', '.github/workflows/epg.yml']
permissions:
  contents: write
concurrency: epg
jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: mkdir out && python3 tools/epg.py out/epg.json
      - name: Publish
        run: |
          cd out && git init -q -b epg && git add epg.json
          git -c user.name=guide -c user.email=guide@users.noreply.github.com commit -qm "guide $(date -u +%FT%RZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" epg
