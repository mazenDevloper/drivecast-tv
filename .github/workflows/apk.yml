name: APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', 'gradle/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with: { path: ~/.gradle/wrapper, key: "gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}" }
      # one signing key for every build (app/signing/drivecast-tv.jks, in the repository): the TV's «⬆️ update» installs a new
      # build over the old one only when the key is the same — checked below before anything is published
      - name: Build
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew -q assembleRelease && break; echo "retry $i"; sleep 30; done
          # Gradle's download servers down: the Gradle that comes with the runner
          O=app/build/outputs/apk
          [ -f $O/full/release/app-full-release.apk ] || { gradle --version | head -3; gradle -q assembleRelease; }
          test -f $O/full/release/app-full-release.apk && test -f $O/lite/release/app-lite-release.apk
          cp $O/full/release/app-full-release.apk DriveCastTV.apk
          cp $O/lite/release/app-lite-release.apk DriveCastTVLite.apk
          # the APK must carry DriveCast TV's own key (its certificate's SHA-256), or the TV refuses it as an update
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for A in DriveCastTV.apk DriveCastTVLite.apk; do
            "$AS" verify --print-certs $A | grep -qi 'SHA-256 digest: f4d6ca901e1e97a8d918196941890d0f9cb0ef7e29d615395c43656509aae0d2' \
              || { "$AS" verify --print-certs $A; echo "::error::$A is not signed with DriveCast TV's key"; exit 1; }
          done
      - name: Release «latest»
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          # the full APK first: builds before 105 take the release's first file (GitHub lists them by name: «DriveCastTV.apk» < «DriveCastTVLite.apk»)
          gh release create latest DriveCastTV.apk -t "DriveCast TV (build ${{ github.run_number }})" -n "الشاشة الرئيسية للتلفزيون. ثبّتها مع كلود: اقرأ skills/drivecast-tv/SKILL.md"
          gh release upload latest DriveCastTVLite.apk
