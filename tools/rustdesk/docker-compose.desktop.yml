# RustDesk's server on Docker Desktop (Windows / Mac) or behind ZeroTier: the same two programs as docker-compose.yml, with the
# ports published one by one — Docker Desktop has no «host» network, so the plain file's ports were never reachable from outside
# the computer (the apps said «Failed to connect to …:21118» / «فشل الاتصال عبر خادم rendezvous»).
#   docker compose -f docker-compose.desktop.yml up -d
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    command: hbbs
    volumes:
      - ./data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped
